<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sumadora</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Sumadora</h1>
    <p class="subtitle">Introduce dos números y súmalos</p>

    <form id="sum-form">
      <div class="field">
        <label for="a">Número 1</label>
        <input type="number" id="a" inputmode="decimal" step="any" required />
      </div>

      <div class="field">
        <label for="b">Número 2</label>
        <input type="number" id="b" inputmode="decimal" step="any" required />
      </div>

      <button type="submit">Sumar</button>
    </form>

    <div id="result" class="result" aria-live="polite"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
